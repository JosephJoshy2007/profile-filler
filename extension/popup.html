<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile Filler</title>
    <style>
      * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      body { margin: 0; background: #f6f7f9; color: #1f2328; font-size: 13px; }
      header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #d0d7de; }
      header h1 { font-size: 15px; margin: 0; }
      header .sub { color: #57606a; margin-top: 4px; font-size: 12px; }
      main { padding: 16px; }
      .card { background: #fff; border-radius: 8px; border: 1px solid #d0d7de; padding: 14px; margin-bottom: 12px; }
      .card h2 { font-size: 13px; margin: 0 0 8px 0; }
      .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f6f7f9; }
      .row:last-child { border-bottom: 0; }
      .row .lbl { flex: 0 0 120px; color: #57606a; font-size: 11px; }
      .row .val { flex: 1; word-break: break-word; }
      .badge { display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 10px; font-weight: 600; }
      .badge.ok { background: #dafbe1; color: #1a7f37; }
      .badge.skip { background: #f6f7f9; color: #57606a; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button { padding: 6px 12px; border-radius: 6px; border: 1px solid #d0d7de; background: #fff; cursor: pointer; font-size: 12px; }
      button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
      button.primary:hover { background: #1a5fd0; }
      button.danger { background: #fff; border-color: #d0d7de; color: #cf222e; }
      button:hover { background: #f6f7f9; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .status { margin-top: 8px; color: #57606a; font-size: 11px; }
      .editor { margin-top: 8px; }
      .editor input, .editor textarea { width: 100%; padding: 6px 8px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 12px; margin-bottom: 6px; }
      .editor label { display: block; font-size: 11px; color: #57606a; margin-bottom: 2px; }
      .toggle { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
      .switch { position: relative; width: 32px; height: 16px; background: #d0d7de; border-radius: 8px; transition: background 0.15s; }
      .switch::after { content:''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: #fff; border-radius: 50%; transition: left 0.15s; }
      .on .switch { background: #1f6feb; }
      .on .switch::after { left: 18px; }
      .sync-box { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
      .sync-box h3 { font-size: 13px; margin: 0 0 8px 0; }
      .sync-status { margin-top: 10px; padding: 8px; border-radius: 6px; font-size: 12px; }
      .sync-status.ok { background: #dafbe1; color: #1a7f37; }
      .sync-status.err { background: #ffebe9; color: #cf222e; }
    </style>
  </head>
  <body>
    <header>
      <h1>Profile Filler</h1>
      <div class="sub" id="urlStatus">Loading...</div>
    </header>
    <main>
      <div class="card">
        <h2>Status</h2>
        <div id="siteState" class="status"></div>
        <div class="actions" style="margin-top:8px;">
          <button id="toggleSite" class="primary">Disable on this site</button>
          <button id="reFill">Re-fill now</button>
          <button id="openWebApp">Open Web App</button>
        </div>
      </div>

      <div class="sync-box">
        <h3>Import from Web App</h3>
        <p class="status">Paste the JSON you copied from the webapp, or import a file.</p>
        <div class="editor">
          <textarea id="importText" rows="3" placeholder='{"version":1,"fields":{...},...}'></textarea>
        </div>
        <div class="actions">
          <button id="importPaste" class="primary">Import JSON</button>
          <label class="btn">
            From File
            <input type="file" id="importFile" accept=".json" style="display:none" />
          </label>
        </div>
        <div id="syncStatus"></div>
      </div>

      <div class="card" id="resultsCard" style="display:none;">
        <h2>Filled fields</h2>
        <div id="results"></div>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
